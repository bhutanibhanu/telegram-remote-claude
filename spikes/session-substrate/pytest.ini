[pytest]
# Spike-local config. Its mere presence makes pytest's rootdir resolve inside
# spikes/session-substrate/ rather than picking up the repo-root pytest.ini
# (which sets asyncio_mode=auto + testpaths=tests and would mis-discover here;
# the spike venv has no pytest-asyncio). Keeps the spike's one unit test
# self-contained and independent of production test config.
addopts = -q
